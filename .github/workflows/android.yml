name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (engine, ai, app)
        run: ./gradlew --no-daemon :engine:test :ai:test :app:testDebugUnitTest

      - name: Android Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Decode signing key
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Warn about unsigned release
        if: ${{ env.SIGNING_KEYSTORE_BASE64 == '' }}
        run: echo "::warning::SIGNING_KEYSTORE_BASE64 is not set, release APK is signed with a temporary debug key and cannot update a previous install. See README, section Signing."

      - name: Build APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/uni-pars-${GITHUB_RUN_NUMBER}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/uni-pars-${GITHUB_RUN_NUMBER}-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: uni-pars-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload reports and Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            engine/build/reports/
            ai/build/reports/
            app/schemas/
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
